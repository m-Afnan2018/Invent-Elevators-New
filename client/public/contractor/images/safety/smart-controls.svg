  <path d="M220 380V420" stroke="#D4A64A" stroke-width="4"/>
  <path d="M256 380V435" stroke="#D4A64A" stroke-width="4"/>
  <path d="M292 380V420" stroke="#D4A64A" stroke-width="4"/>

